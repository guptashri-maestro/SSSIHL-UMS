[project]
name = "fastapi-employee-management"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Datha", email = "dathster21@gmail.com" }
]

dependencies = [
    "fastapi>=0.127.0,<0.128.0",
    "uvicorn>=0.40.0,<0.41.0",
    "sqlalchemy>=2.0.45,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "httpx>=0.28.1,<0.29.0",
    "boto3>=1.42.14,<2.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "mangum>=0.19.0,<0.20.0",
    "greenlet (>=3.3.0,<4.0.0)",
    "alembic (>=1.17.2,<2.0.0)"
]

[tool.poetry]
# REQUIRED for Poetry 2 + PEP 621 projects
package-mode = true

# Tell Poetry where the package lives (app layout)
packages = [
    { include = "fastapi_employee_management", from = "app" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
